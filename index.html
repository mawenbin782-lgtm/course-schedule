<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的课程表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6f8;
    color: #222;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  header h1 { font-size: 22px; }
  #addBtn {
    background: #2f6fed; color: #fff; border: none; border-radius: 8px;
    padding: 9px 14px; font-size: 14px; cursor: pointer;
  }
  #addBtn:hover { background: #2459c4; }

  .day { margin-bottom: 14px; }
  .day-head {
    font-size: 15px; font-weight: 600; color: #555;
    padding: 6px 2px; border-bottom: 1px solid #e2e4e8;
    margin-bottom: 8px;
  }
  .day-head .count { font-weight: 400; color: #999; font-size: 13px; margin-left: 6px; }
  .empty { color: #b0b3b8; font-size: 13px; padding: 2px; }

  .card {
    background: #fff; border: 1px solid #e8eaee; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .c-name { font-size: 16px; font-weight: 600; }
  .c-meta { color: #666; font-size: 14px; margin-top: 4px; }
  .c-meta span { margin-right: 14px; }
  .c-note {
    margin-top: 8px; font-size: 13px; color: #b26a00;
    background: #fff7e6; border-radius: 6px; padding: 7px 10px;
  }
  .c-note::before { content: "📌 "; }
  .c-actions { flex-shrink: 0; }
  .c-actions button {
    background: none; border: 1px solid #d8dbe0; border-radius: 6px;
    padding: 3px 8px; font-size: 12px; color: #666; cursor: pointer; margin-left: 6px;
  }
  .c-actions button:hover { border-color: #999; color: #333; }

  /* modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal.hidden { display: none; }
  .modal-box {
    background: #fff; border-radius: 12px; padding: 20px;
    width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
  }
  .modal-box h2 { font-size: 17px; margin-bottom: 14px; }
  .modal-box label { display: block; font-size: 13px; color: #666; margin-bottom: 10px; }
  .modal-box input, .modal-box select, .modal-box textarea {
    width: 100%; margin-top: 4px; padding: 8px 10px; font-size: 14px;
    border: 1px solid #d8dbe0; border-radius: 7px; font-family: inherit;
  }
  .modal-box textarea { resize: vertical; min-height: 60px; }
  .row2 { display: flex; gap: 10px; }
  .row2 label { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .modal-actions button {
    border-radius: 7px; padding: 8px 14px; font-size: 14px; cursor: pointer; border: 1px solid #d8dbe0; background: #fff;
  }
  #f-save { background: #2f6fed; color: #fff; border: none; }
  #f-delete { color: #d33; border-color: #f0c4c4; margin-right: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 我的课程表</h1>
    <button id="addBtn">＋ 添加课程</button>
  </header>
  <main id="schedule"></main>
</div>

<!-- 编辑弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modalTitle">添加课程</h2>
    <label>课程名
      <input id="f-name" placeholder="例：NLP and LLMs">
    </label>
    <div class="row2">
      <label>星期
        <select id="f-day"></select>
      </label>
    </div>
    <div class="row2">
      <label>开始时间
        <input type="time" id="f-start" value="13:30">
      </label>
      <label>结束时间
        <input type="time" id="f-end" value="15:00">
      </label>
    </div>
    <label>教室地点
      <input id="f-loc" placeholder="例：邯郸校区 HGX103">
    </label>
    <label>任务备注
      <textarea id="f-note" placeholder="例：周五前交作业 / 课前预习 slides 第3章"></textarea>
    </label>
    <div class="modal-actions">
      <button id="f-delete" class="hidden">删除</button>
      <button id="f-cancel">取消</button>
      <button id="f-save">保存</button>
    </div>
  </div>
</div>

<script>
const DAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
const STORE_KEY = "course_schedule_v3";

// 初始样板数据（只有一门已知的课，其余自己在网页上加）
const DEFAULT_DATA = [
  { id: 1, name: "统计软件简介", day: 1, start: "08:00", end: "10:40", loc: "邯郸校区 HGX310", note: "1-16周" },
  { id: 2, name: "时间序列分析（专硕）", day: 1, start: "18:30", end: "21:05", loc: "邯郸校区 H2101", note: "1-16周" },
  { id: 3, name: "游戏化思维与人文", day: 2, start: "08:00", end: "09:40", loc: "邯郸校区 H3208", note: "1-16周" },
  { id: 4, name: "医疗大数据高等统计方法", day: 2, start: "18:30", end: "21:05", loc: "邯郸校区 H6112", note: "1-16周" },
  { id: 5, name: "知识图谱概念与技术", day: 3, start: "09:55", end: "12:30", loc: "江湾校区 JB301", note: "1-16周" },
  { id: 6, name: "自然语言处理与大语言模型", day: 3, start: "13:30", end: "16:10", loc: "邯郸校区 HGX103", note: "1-16周" },
  { id: 7, name: "数据可视化应用及实现", day: 5, start: "09:55", end: "12:30", loc: "邯郸校区 H2214", note: "1-16周" },
  { id: 8, name: "机器学习与神经网络导论", day: 5, start: "18:30", end: "21:05", loc: "邯郸校区 H6112", note: "1-16周" }
];

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function save(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

let data = load();
let editingId = null; // null = 新增

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const main = document.getElementById("schedule");
  let html = "";
  for (let d = 1; d <= 7; d++) {
    const courses = data.filter(c => Number(c.day) === d)
                        .sort((a, b) => (a.start || "").localeCompare(b.start || ""));
    html += '<div class="day"><div class="day-head">' + DAYS[d - 1];
    html += '<span class="count">' + (courses.length ? courses.length + " 节" : "") + "</span></div>";
    if (!courses.length) {
      html += '<div class="empty">这天没课</div>';
    }
    courses.forEach(c => {
      html += '<div class="card">';
      html += '<div class="card-top"><div>';
      html += '<div class="c-name">' + esc(c.name) + "</div>";
      html += '<div class="c-meta"><span>🕐 ' + esc(c.start || "—") + " – " + esc(c.end || "—") + "</span>";
      html += '<span>📍 ' + esc(c.loc || "未填") + "</span></div></div>";
      html += '<div class="c-actions">';
      html += '<button data-edit="' + c.id + '">编辑</button>';
      html += "</div></div>";
      if (c.note && c.note.trim()) {
        html += '<div class="c-note">' + esc(c.note) + "</div>";
      }
      html += "</div>";
    });
    html += "</div>";
  }
  main.innerHTML = html;
}

function fillDaySelect() {
  const sel = document.getElementById("f-day");
  sel.innerHTML = DAYS.map((n, i) => '<option value="' + (i + 1) + '">' + n + "</option>").join("");
}

function openModal(course) {
  editingId = course ? course.id : null;
  document.getElementById("modalTitle").textContent = course ? "编辑课程" : "添加课程";
  document.getElementById("f-name").value = course ? course.name : "";
  document.getElementById("f-day").value = course ? course.day : 1;
  document.getElementById("f-start").value = course ? course.start : "13:30";
  document.getElementById("f-end").value = course ? course.end : "15:00";
  document.getElementById("f-loc").value = course ? course.loc : "";
  document.getElementById("f-note").value = course ? course.note : "";
  document.getElementById("f-delete").classList.toggle("hidden", !course);
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("f-name").focus();
}
function closeModal() {
  document.getElementById("modal").classList.add("hidden");
}

function saveFromModal() {
  const name = document.getElementById("f-name").value.trim();
  if (!name) { alert("课程名不能为空"); return; }
  const item = {
    name: name,
    day: Number(document.getElementById("f-day").value),
    start: document.getElementById("f-start").value,
    end: document.getElementById("f-end").value,
    loc: document.getElementById("f-loc").value.trim(),
    note: document.getElementById("f-note").value.trim()
  };
  if (editingId === null) {
    item.id = data.length ? Math.max(...data.map(c => c.id)) + 1 : 1;
    data.push(item);
  } else {
    const i = data.findIndex(c => c.id === editingId);
    if (i >= 0) data[i] = Object.assign({ id: editingId }, item);
  }
  save(data);
  render();
  closeModal();
}

function deleteFromModal() {
  if (editingId === null) return;
  if (!confirm("确定删除这门课？")) return;
  data = data.filter(c => c.id !== editingId);
  save(data);
  render();
  closeModal();
}

document.getElementById("addBtn").addEventListener("click", () => openModal(null));
document.getElementById("f-save").addEventListener("click", saveFromModal);
document.getElementById("f-cancel").addEventListener("click", closeModal);
document.getElementById("f-delete").addEventListener("click", deleteFromModal);
document.getElementById("modal").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById("schedule").addEventListener("click", e => {
  const btn = e.target.closest("[data-edit]");
  if (!btn) return;
  const c = data.find(x => x.id === Number(btn.dataset.edit));
  if (c) openModal(c);
});

fillDaySelect();
render();
</script>
</body>
</html>
